[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_1A0037001650344D30363620-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 235
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: -5
position_min: -5
position_max: 235
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -5.0

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 33.500 # Change to 7.710 if using the Micro Swiss Direct Drive extruder
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 300 # Raised for Micro Swiss All-Metal Hotend

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

[bltouch]
sensor_pin: ^PC14 # Change to ^PC2 if your BLTouch 2-pin wire is plugged into the Z-Stop port instead of the 5-pin Z-Probe port
control_pin: PA1
x_offset: -44.0   # Standard Ender 3 BLTouch bracket X offset
y_offset: -10.0   # Standard Ender 3 BLTouch bracket Y offset
#z_offset: 0.0     # Will be overwritten when you run PROBE_CALIBRATE
speed: 5.0
samples: 2
sample_retract_dist: 3.0

[safe_z_home]
home_xy_position: 161.5, 127.5 # Centers the BLTouch probe on the 235x235 bed
speed: 50
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 15, 15
mesh_max: 191, 225 # Accounts for the -44, -10 BLTouch offset so the X/Y carriage does not hit the frame
probe_count: 5, 5
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

[heater_fan heatbreak_cooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15

[fan]
pin: PC6

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2

[output_pin beeper]
pin: EXP1_1

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  # Parameters
  {% set z = params.Z|default(10)|int %}
  {% if printer.print_stats.state == "printing" %}
    SAVE_GCODE_STATE NAME=pause_state
    PAUSE_BASE
    G91
    {% if printer.toolhead.position.z < (printer.toolhead.axis_maximum.z - z) %}
      G1 Z{z} F900
    {% else %}
      G1 Z{printer.toolhead.axis_maximum.z - printer.toolhead.position.z} F900
    {% endif %}
    G90
    G1 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_minimum.y + 5} F6000
    SAVE_GCODE_STATE NAME=pause_park_state
  {% endif %}

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  {% if printer.print_stats.state == "paused" %}
    RESTORE_GCODE_STATE NAME=pause_park_state MOVE=1 MOVE_SPEED=100
    RESTORE_GCODE_STATE NAME=pause_state MOVE=1 MOVE_SPEED=60
    RESUME_BASE
  {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
  G28 X Y
  M106 S0
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE

[screws_tilt_adjust]
screw1: 72.5, 43.5
screw1_name: front left screw
# Set X to 242.5 if stepper_x allows it; otherwise clamp to 230 or 235
screw2: 235.0, 43.5
screw2_name: front right screw
screw3: 235.0, 211.5
screw3_name: rear right screw
screw4: 72.5, 211.5
screw4_name: rear left screw
horizontal_move_z: 10
speed: 150
screw_thread: CW-M4

